<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07110f">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"9f5f5350c22b4b08bfa415838cf789a6"}'></script>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Smithproxy home"><img class="brand-mark" src="{{ '/assets/img/smithproxy-mark.svg' | relative_url }}" alt=""><span>smithproxy<small>traffic inspection proxy</small></span></a>
      <nav aria-label="Main navigation"><a href="#capabilities">Capabilities</a><a href="#start">Get started</a><a href="https://smithproxy.readthedocs.io/en/latest/">Docs</a><a class="nav-github" href="https://github.com/astibal/smithproxy" aria-label="Smithproxy on GitHub">GitHub ↗</a></nav>
    </header>
    <main id="content">{{ content }}</main>
    <footer class="site-footer">
      <div class="brand footer-brand"><img class="brand-mark" src="{{ '/assets/img/smithproxy-mark.svg' | relative_url }}" alt=""><span>smithproxy<small>Open-source traffic inspection for Linux.</small></span></div>
      <div class="footer-links"><a href="https://github.com/astibal/smithproxy">Source</a><a href="https://smithproxy.readthedocs.io/en/latest/">Documentation</a><a href="https://github.com/astibal/smithproxy/issues">Issues</a><a href="mailto:support@smithproxy.org">support@smithproxy.org</a></div>
      <p>GPL-3.0 · Built for people who need to see the traffic, not just count it.</p>
    </footer>
  </body>
</html>
